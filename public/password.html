<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Cards Against Humanity - Enter the Password</title>
    <link href="./favicon.ico" rel="icon" type="image/x-icon">
    <link href="./style.css" rel="stylesheet">
</head>
<body>
    <nav>
        <h1><a href="/">Cards Against Humanity Online (unofficial)</a></h1>
    </nav>
    <main>
        <form class="join" action="/api/join">
            <h1>This lobby is password protected!</h1>
            <div class="interactBox">
                <label for="password">Enter the password.</label>
                <input id="password" name="password" minlength required>
                <button type="submit">Join!</button>
            </div>
        </form>
    </main>
</form>
</body>
</html>
