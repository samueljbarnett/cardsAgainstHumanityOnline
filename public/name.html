<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Cards Against Humanity - Choose a Name</title>
    <link href="./favicon.ico" rel="icon" type="image/x-icon">
</head>
<body>
    <form class="join" action="/api/join">
        <h1>Joining lobby:</h1>
        <div class="interactBox">
            <label for="name">Choose your player name:</label>
            <input id="name" name="name" type="text" required minlength="1" maxlength="25">
            <button type="submit">Join!</button>
        </div>
    </form>
</form>
</body>
</html>
